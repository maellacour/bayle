name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  
  build-upload-commands:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get tag
        run: |
         TAG=${{ github.ref_name }}
         echo "RELEASE_TAG=${TAG#v}" >> $GITHUB_ENV
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read changelog entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ env.RELEASE_TAG }}
          path: ./CHANGELOG.md

      - name: install node v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
         npm install -g @yao-pkg/pkg
         yarn workspaces focus @bayle/cli
         pkg cli/package.json --compress Brotli --output bayle
         mv bayle-linux bayle
         mv bayle-win.exe bayle.exe

      - name: Compress
        run: |
         tar -zczf bayle-linux-x64.tar.gz backup base.env docker-compose.microservices.base.yml docker-compose.microservices.prod.yml bayle
         tar -zczf bayle-macos-x64.tar.gz backup base.env docker-compose.microservices.base.yml docker-compose.microservices.prod.yml bayle-macos
         zip bayle-win-x64.zip backup base.env docker-compose.microservices.base.yml docker-compose.microservices.prod.yml bayle.exe
    
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bayle ${{ github.ref_name }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
          body: |
            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog_reader.outputs.changes }}

            ---

            ## Container images

            Every service image is published to the GitHub Container Registry,
            tagged `${{ env.RELEASE_TAG }}` and `latest`:

            ```
            ghcr.io/${{ github.repository }}/<service>:${{ env.RELEASE_TAG }}
            ```

            Services: `gateway`, `api`, `tenantapi`, `authenticator`,
            `pdfgenerator`, `emailer`, `resetservice`, `landlord-frontend`,
            `tenant-frontend`.

            ## Self-hosting

            New install: download the `bayle` bundle below (the CLI plus the
            compose files and `base.env`), or follow the
            [self-hosting guide](https://github.com/${{ github.repository }}#self-host-the-application)
            in the README.

            Existing install: pull the new images and restart with
            `docker compose pull && docker compose up -d`. Check the notes above
            for any migration step.

            ### Downloads
            - Linux (x64): `bayle-linux-x64.tar.gz`
            - macOS (x64): `bayle-macos-x64.tar.gz`
            - Windows (x64): `bayle-win-x64.zip`

            ## Build details
            - Version: `${{ env.RELEASE_TAG }}`
            - Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Workflow run: [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ## Issues

            Found a problem? Open an issue on the
            [tracker](https://github.com/${{ github.repository }}/issues).
          files: |
           ./bayle-linux-x64.tar.gz
           ./bayle-macos-x64.tar.gz
           ./bayle-win-x64.zip


  build-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
            - appname: gateway
              image: ghcr.io/${{ github.repository }}/gateway
              dockerfile: services/gateway/Dockerfile
            - appname: api
              image: ghcr.io/${{ github.repository }}/api
              dockerfile: services/api/Dockerfile
            - appname: tenantapi
              image: ghcr.io/${{ github.repository }}/tenantapi
              dockerfile: services/tenantapi/Dockerfile
            - appname: authenticator
              image: ghcr.io/${{ github.repository }}/authenticator
              dockerfile: services/authenticator/Dockerfile
            - appname: pdfgenerator
              image: ghcr.io/${{ github.repository }}/pdfgenerator
              dockerfile: services/pdfgenerator/Dockerfile
            - appname: emailer
              image: ghcr.io/${{ github.repository }}/emailer
              dockerfile: services/emailer/Dockerfile
            - appname: resetservice
              image: ghcr.io/${{ github.repository }}/resetservice
              dockerfile: services/resetservice/Dockerfile
            - appname: landlord-frontend
              image: ghcr.io/${{ github.repository }}/landlord-frontend
              dockerfile: webapps/landlord/Dockerfile
            - appname: tenant-frontend
              image: ghcr.io/${{ github.repository }}/tenant-frontend
              dockerfile: webapps/tenant/Dockerfile

    steps:
        - name: Get tag
          run: |
           TAG=${{ github.ref_name }}
           echo "RELEASE_TAG=${TAG#v}" >> $GITHUB_ENV

        - name: Checkout
          uses: actions/checkout@v4

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extract metadata (tags, labels) for Docker
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ matrix.image }}

        - name: Build and push to GitHub Container Registry
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ${{ matrix.dockerfile }}
            push: true
            tags: '${{ matrix.image }}:${{ env.RELEASE_TAG }},${{ matrix.image }}:latest'
            labels: ${{ steps.meta.outputs.labels }}

     
